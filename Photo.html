<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Photo Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #ffd6e0 0%, transparent 35%),
        radial-gradient(circle at bottom right, #bdefff 0%, transparent 40%),
        linear-gradient(135deg, #dff7ff, #f8e8f0);
    color: #2f5d8c;
    text-align: center;
}

#gallery {
    width: 900px;
    max-width: 92%;
    margin: 55px auto;
    padding: 35px;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 30px;
    box-shadow:
        0 20px 50px rgba(47, 93, 140, 0.18),
        0 5px 15px rgba(0, 0, 0, 0.08);
}

h1 {
    margin: 0 0 28px;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    letter-spacing: 3px;
    color: #ff4d6d;
    text-shadow: 2px 3px 0 rgba(255, 77, 109, 0.12);
}

h1::after {
    content: "";
    display: block;
    width: 70px;
    height: 4px;
    margin: 12px auto 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff4d6d, #ff9a9e);
}
.carousel {
    overflow: hidden;
    border-radius: 22px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
}

.carousel-inner {
    border-radius: 22px;
}

.carousel-item {
    background: #eaf7fc;
}

.carousel img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    border-radius: 22px;
    transition: transform 0.6s ease;
}

.carousel-item.active img {
    animation: zoomIn 5s ease forwards;
}

@keyframes zoomIn {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}
.carousel-indicators {
    margin-bottom: 18px;
}

.carousel-indicators button {
    width: 10px;
    height: 10px;
    border: 0;
    border-radius: 50%;
    margin: 0 5px;
    background-color: white;
    opacity: 0.6;
    transition: all 0.3s ease;
}

.carousel-indicators button.active {
    width: 28px;
    border-radius: 10px;
    opacity: 1;
    background-color: #ff4d6d;
}
.carousel-control-prev,
.carousel-control-next {
    width: 55px;
    height: 55px;
    top: 50%;
    transform: translateY(-50%);
    margin: 0 18px;
    border-radius: 50%;
    background: rgba(47, 93, 140, 0.75);
    opacity: 0;
    transition: all 0.3s ease;
}

.carousel:hover .carousel-control-prev,
.carousel:hover .carousel-control-next {
    opacity: 1;
}

.carousel-control-prev:hover,
.carousel-control-next:hover {
    background: #ff4d6d;
    transform: translateY(-50%) scale(1.1);
}

@media (max-width: 768px) {

    #gallery {
        max-width: 94%;
        margin: 30px auto;
        padding: 22px;
        border-radius: 22px;
    }

    h1 {
        font-size: 27px;
        letter-spacing: 2px;
    }

    .carousel img {
        height: 320px;
    }

    .carousel-control-prev,
    .carousel-control-next {
        width: 42px;
        height: 42px;
        margin: 0 8px;
        opacity: 1;
    }
}

</style>
</head>


<body>
<div id="gallery">

    <h1>PHOTO GALLERY</h1>

    <div
        id="carouselExample"
        class="carousel slide"
        data-bs-ride="carousel"
        data-bs-interval="3500"
    >

        <div class="carousel-indicators">

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="0"
                class="active"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="1"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="2"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="3"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="4"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="5"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="6"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="7"
            ></button>

            <button
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide-to="8"
            ></button>

        </div>

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="images/pic1.jpg" class="d-block w-100" alt="Gallery Photo 1">
            </div>

            <div class="carousel-item">
                <img src="images/pic2.jpg" class="d-block w-100" alt="Gallery Photo 2">
            </div>

            <div class="carousel-item">
                <img src="images/pic3.webp" class="d-block w-100" alt="Gallery Photo 3">
            </div>

            <div class="carousel-item">
                <img src="images/pic4.avif" class="d-block w-100" alt="Gallery Photo 4">
            </div>

            <div class="carousel-item">
                <img src="images/pic5.avif" class="d-block w-100" alt="Gallery Photo 5">
            </div>

            <div class="carousel-item">
                <img src="images/pic6.jfif" class="d-block w-100" alt="Gallery Photo 6">
            </div>

            <div class="carousel-item">
                <img src="images/pic7.jpg" class="d-block w-100" alt="Gallery Photo 7">
            </div>

            <div class="carousel-item">
                <img src="images/pic8.jfif" class="d-block w-100" alt="Gallery Photo 8">
            </div>

            <div class="carousel-item">
                <img src="images/pic9.avif" class="d-block w-100" alt="Gallery Photo 9">
            </div>

        </div>

        <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev"
        >
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="next"
        >
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
